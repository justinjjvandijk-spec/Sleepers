<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleepers">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="IMG_2519.png">
<link rel="icon" type="image/png" href="IMG_2519.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sleepers Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-column phone app — production header, week views in stacked rows, fixed bottom tab bar. Deliberately dark: black, neutral greys, one orange accent. */
:root{
  --bg:#0a0a0b; --surface:#151517; --raise:#1f1f22; --line:#2b2b2f; --fg:#f3f3f4; --muted:#a3a3aa; --dim:#6f6f77;
  --amber:#ff7a1a; --amber-ink:#150900; --amber-soft:rgba(255,122,26,.14);
  --blue:#7cb8ff; --green:#86c98a; --purple:#c7a2f2; --red:#ff8a7a; --yellow:#f3d067; --grey:#a3a3aa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}

header{background:var(--bg)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:12px}
.banner{height:40px;width:auto;max-width:100%;border-radius:6px;display:block}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.word{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.08em;line-height:1}
.word small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.who{border:0;background:none;color:var(--muted);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;border-bottom:1px dotted var(--dim);padding:2px 0;flex:none}
.jobtitle{display:grid;gap:6px;text-align:left;border:0;background:none;padding:4px 0 16px;width:100%;color:var(--fg)}
#jobname{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:.95;letter-spacing:.01em}
.jobsub{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.glow{height:2px;background:linear-gradient(90deg,transparent,var(--amber) 22%,#ffc79e 50%,var(--amber) 78%,transparent);opacity:.85}
.weeknav{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.weeknav .wk{font-family:var(--mono);font-weight:600;font-size:17px;color:var(--amber);letter-spacing:.04em}
.weeknav .rng{font-family:var(--mono);font-size:13.5px;color:var(--muted)}
.wbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--fg);flex:none}
.drow{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;color:var(--fg)}
.drow .dn{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.drow .dw{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:5px}
.drow .tm{font-family:var(--mono);font-size:15px;min-width:0;font-variant-numeric:tabular-nums}
.drow .tm small{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .tm .badges{justify-content:flex-start;margin-top:5px}
.drow .hr{text-align:right;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.drow .hr small{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:5px}
.drow.off{opacity:.42}.drow.off .tm{font-family:var(--body);font-style:italic;color:var(--muted)}
.drow.todo .tm{font-family:var(--body);font-style:italic;color:var(--amber)}
.drow.today .dn{color:var(--amber)}
.totcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:18px 0 12px}
.totcard .k{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.totcard .big{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.totcard .big small{font-size:18px;margin-left:3px}
.totcard .side{margin-left:auto;text-align:right;font-family:var(--mono);font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.linkbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:12px;padding:14px 16px;font-size:16px;margin-bottom:10px;color:var(--fg)}
.sect{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.mtx{min-width:0}
.mtx th,.mtx td{padding:11px 8px}
.mtx td.c,.mtx th.c{text-align:center}
.mtx td.c button{border:0;background:none;font:inherit;color:inherit;padding:2px 4px}
.mtx .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--amber);vertical-align:middle}
.mtx .nil{color:var(--dim)}
.mtx tr.we td{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.035) 6px 12px)}
.mtx tr.me td{background:var(--amber-soft)}
.mtx tfoot td{font-weight:700;border-bottom:0}
.mtx th small{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.jobbtn{display:flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 14px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;max-width:50%}
.jobbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobbtn svg{flex:none;opacity:.7}

main{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px))}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.mepick{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.mepick select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--fg)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.bhead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dd{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;color:var(--amber);min-width:48px}
.bmeta{min-width:0;flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmeta b{color:var(--fg);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--raise);border-radius:10px;width:40px;height:40px;font-size:18px;display:grid;place-items:center;flex:none;color:var(--muted)}

.hrow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:13px 12px;min-height:52px;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow.mine{background:var(--amber-soft)}
.hrow.mine .pname{color:var(--amber)}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.times{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.times .l{color:var(--dim)}
.times.empty{color:var(--dim);font-family:var(--body);font-style:italic}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.b{font-family:var(--mono);font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--raise);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.b.ot{background:rgba(255,122,26,.18);color:var(--amber)}
.b.dr{background:rgba(124,184,255,.15);color:var(--blue)}
.note{grid-column:2/-1;font-size:13px;color:var(--muted);margin-top:-4px;overflow-wrap:anywhere}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px;padding:12px}
.kv .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kv .v{font-size:14.5px;overflow-wrap:anywhere}
.kv .v.mono{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.kv.wide{grid-column:1/-1}
.cardbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}

.irow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.irow:first-of-type{border-top:0}
.irow.done .iname{color:var(--dim);text-decoration:line-through}
.check{width:32px;height:32px;border-radius:7px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#0f1a10}
.iname{font-weight:500;background:none;border:0;text-align:left;padding:0;min-width:0;overflow-wrap:anywhere}
.iqty{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.cat{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--grey))}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-size:13.5px}
td:first-child{font-family:var(--body);font-weight:600;font-size:15px}
tr.mine td:first-child{color:var(--amber)}
tbody tr:last-child td{border-bottom:0}

.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px}
.empty h3{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--fg);margin:0 0 6px}
.banner{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;background:var(--surface)}
.banner b{color:var(--yellow)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,10,11,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabsin{display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;margin:0 auto}
.tabsin button{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--dim)}
.tabsin button{font-size:12px;letter-spacing:.02em;min-height:68px;padding:10px 2px 12px;gap:5px;border-top:3px solid transparent;white-space:nowrap}
.tabsin svg{width:26px;height:26px}
.tabsin button[aria-current="page"]{color:var(--amber);border-top-color:var(--amber)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.03em;margin:0 0 14px;text-wrap:balance}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:16px}
.field input[type=time],.field input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.field label.ck{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg);padding:10px 0}
.field .ck input{width:22px;height:22px;padding:0;accent-color:var(--amber)}
.field textarea{min-height:76px;resize:vertical}
.crewpick{display:flex;flex-wrap:wrap;gap:6px}
.sfoot{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:13px 18px;font-weight:600;min-height:48px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);flex:1}
.btn.danger{color:var(--red);border-color:rgba(255,138,122,.35);background:none}
.btn.danger.arm{background:var(--red);color:#1d0805;border-color:var(--red)}
.byline{font-size:12.5px;color:var(--dim);margin-top:12px}
.joblist{display:grid;gap:6px;margin-bottom:16px}
.jobitem{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;text-align:left;width:100%}
.jobitem[aria-current="true"]{border-color:var(--amber)}
.jobitem small{color:var(--muted)}
.sub{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
/* callsheets */
.cslist{display:grid;gap:10px}
.cscard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.cscard .when{font-size:13px;color:var(--muted)}
.cscard .loc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cscard .call{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--amber);text-align:right;line-height:1.1}
.cscard .call small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.cscard.today{border-color:var(--amber)}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:4px 0;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.cshero{margin-bottom:14px}
.cshero .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cshero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);letter-spacing:.02em;line-height:1;margin:4px 0 0;text-wrap:balance}
.times4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.times4>div{background:var(--surface);padding:10px 12px}
.times4 .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.times4 .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.times4 .key .v{color:var(--amber)}
.times4 .v small{font-size:12px;color:var(--muted);font-weight:400}
.pl{border-color:rgba(255,122,26,.45)}
.pl .bhead{background:var(--amber-soft)}
.srow{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .t{font-family:var(--mono);font-size:13.5px;color:var(--amber);font-variant-numeric:tabular-nums}
.srow .w{min-width:0;overflow-wrap:anywhere}
.srow .w b{font-weight:600}
.srow .w .s{font-size:13.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--raise);color:var(--muted);margin-right:4px;vertical-align:1px}
.tag.n{background:rgba(124,184,255,.15);color:var(--blue)}
.ltxt{padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.drop{display:grid;gap:10px}
.drop input[type=file]{width:100%;background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:14px;font-size:15px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line)}
.navcard{background:var(--surface);padding:12px;display:grid;gap:8px;align-content:start}
.navcard .nk{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.navcard .nv{min-width:0;overflow-wrap:anywhere}.navcard .s{font-size:13.5px;color:var(--muted)}
.navgo{display:block;text-align:center;text-decoration:none}
.navalt{display:flex;gap:14px;font-size:13.5px}.navalt a{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:8px}
.pthumb{border:0;padding:0;background:#000;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1;max-width:100%}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font-size:11.5px;padding:4px 6px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:13.5px;color:var(--muted);min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:380px){.hrow{grid-template-columns:64px 1fr}.badges{grid-column:2;justify-content:flex-start}}
</style>

</head>

const LS={get(k,d){try{const v=localStorage.getItem("slp."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("slp."+k,JSON.stringify(v))}catch(e){}}};
const S={db:null,user:null,uid:null,canWrite:true,status:"loading",jobs:[],jobId:LS.get("job",null),days:[],items:[],recce:[],sheets:[],defects:[],cs:null,rc:null,sample:null,month:LS.get("month","all"),rate:"",tab:({uren:"mijn"})[LS.get("tab","cs")]||LS.get("tab","cs"),week:null,sub:"",hv:"dag",me:LS.get("me",""),mineOnly:LS.get("mine",false),nav:LS.get("nav","google"),unsubs:[],sheet:null};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const fmtDur=m=>{m=+m||0;if(!m)return"";return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")};
const toMin=t=>{if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const span=(a,b)=>{const x=toMin(a),y=toMin(b);if(x==null||y==null)return 0;let d=y-x;if(d<0)d+=1440;return d};
const fmtDate=d=>{if(!d)return"";const x=new Date(d+"T12:00:00");if(isNaN(x))return d;return x.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})};
const ddId=n=>"dd"+String(n).padStart(2,"0");
const job=()=>S.jobs.find(j=>j.id===S.jobId)||null;
const crew=()=>(job()?.crew)||[];
function teamOf(d){const t=[...(d.team||[])];Object.keys(d.hours||{}).forEach(p=>{if(!t.includes(p))t.push(p)});return t}
const RULES=()=>({day:+(job()?.dayMin)||630,free:120,ta:600,taWk:3480,kmP:.25,kmM:.35,...(job()?.rules||{})});
const dayMin=()=>RULES().day;
const travelOf=e=>+e.travel||+e.drive||0;
const dnum=iso=>Math.round(new Date(iso+"T12:00:00")/864e5);
function calc(e){const r=RULES(),tv=travelOf(e),km=+e.km||0;return{ot:otOf(e),tr100:e.driver?Math.min(tv,r.free):0,tr150:Math.max(0,tv-r.free),km,kmEur:km*(e.kmType==="Personen"?r.kmP:r.kmM),park:+e.park||0,pd:pdOf(e)}}
function turnaround(p){const r=RULES(),out={};
  const list=S.days.filter(d=>d.date&&(d.hours||{})[p]&&(d.hours[p].in||d.hours[p].open)).sort((a,b)=>a.date.localeCompare(b.date));
  for(let i=1;i<list.length;i++){const a=list[i-1],b=list[i],ea=a.hours[p],eb=b.hours[p],sA=ea.in||ea.open,eA=ea.out||ea.close;if(!sA||!eA)continue;
    const d0=dnum(a.date),d1=dnum(b.date);if(d1<=d0||d1-d0>4)continue;
    const endAbs=d0*1440+toMin(sA)+span(sA,eA),startAbs=d1*1440+toMin(eb.in||eb.open);
    let wk=false;for(let k=d0+1;k<d1;k++){const wd=new Date(k*864e5).getUTCDay();if(wd===0||wd===6)wk=true}
    const short=Math.floor(Math.max(0,(wk?r.taWk:r.ta)-(startAbs-endAbs))/15)*15;if(short)out[b.id]=short}
  return out}
const myName=()=>(job()?.members||{})[S.uid]||S.me||"";
const leads=()=>job()?.leads||["Michel","Justin"];
const isLead=()=>S.isOwner||leads().includes(myName());
const canEditRow=p=>S.canWrite&&(isLead()||(!!myName()&&p===myName()));
function plDur(cs,p){if(!cs)return 0;const call=callOf(cs);if(!call)return 0;const full=((job()?.roles?.[p]||p).split("·")[0]||"").trim().toLowerCase();let best=0;
  (cs.prelights||[]).forEach(pl=>{const who=(pl.who||"").toLowerCase();const hit=who.includes(p.toLowerCase())||(full&&who.includes(full))||/(licht|light|electric|elektr)/i.test(pl.who||"");if(!hit||!pl.time)return;const d=span(pl.time,call);if(d>0&&d<=360&&d>best)best=d});return best}
const pdOf=e=>/25/.test(e.perdiem||"")?25:/15/.test(e.perdiem||"")?15:0;
const PD=["Geen","Draaidag met overnachting (€15)","Prepdag met overnachting (€25)"];
function missingHours(){const me=myName();if(!me||!S.canWrite)return[];const t=todayISO(),y=new Date(Date.now()-864e5),yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");const now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  return S.days.filter(d=>(d.date===yi||(d.date===t&&nowM>(toMin(d.end)??1080)))&&teamOf(d).includes(me)&&!((d.hours||{})[me]||{}).close)}
function reminderBanner(){const m=missingHours();return m.map(d=>`<div class="banner" style="border-color:rgba(255,122,26,.45);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:180px"><b style="color:var(--amber)">Uren invullen:</b> DD${esc(d.n)} · ${esc(fmtDate(d.date))}</span><button class="btn primary" style="flex:none" data-act="hour" data-day="${d.id}" data-p="${esc(myName())}">Nu invullen</button></div>`).join("")}
const eur=n=>"€"+(Math.round(n*100)/100).toFixed(2).replace(".",",");
const isAuto=e=>e.ot===""||e.ot==null;
const autoOT=e=>(e.open&&e.close)?Math.max(0,span(e.open,e.close)+(+e.pre||0)-dayMin()):0;
const otOf=e=>isAuto(e)?autoOT(e):(+e.ot||0);
const addMin=(t,m)=>{const x=toMin(t);if(x==null)return"";const y=((x+m)%1440+1440)%1440;return String(Math.floor(y/60)).padStart(2,"0")+":"+String(y%60).padStart(2,"0")};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function allPeople(){const set=[...crew()];S.days.forEach(d=>teamOf(d).forEach(p=>{if(!set.includes(p))set.push(p)}));return set}

let toastT;function toast(msg){$("toastroot").innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$("toastroot").innerHTML="",2200)}
async function write(fn,ok="Opgeslagen"){
  if(!S.db){toast("Geen verbinding met de opslag");return false}
  try{await fn();if(ok)toast(ok);return true}
  catch(e){if(e&&e.code==="invalid_argument"&&!S.canWriteKnown){S.canWrite=false;render();toast("Je kunt hier alleen meekijken")}
    else if(e&&e.code==="quota_exceeded")toast("Opslag is vol: verwijder oude klussen");
    else toast("Opslaan lukte niet, probeer het opnieuw");return false}
}

/* ---------- render ---------- */
function render(){
  const j=job();
  $("jobname").textContent=j?j.name:"Klus kiezen";$("jobsub").textContent=j?.subtitle||"";$("whobtn").textContent=myName()||"Wie ben je?";
  $("tabs").innerHTML=TABS.map(([k,l,ic])=>`<button data-act="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${l}</button>`).join("");
  const m=$("main");if(S.status==="code")return;
  if(S.status==="loading"){m.innerHTML=`<div class="empty"><h3>Laden…</h3>Klussen en uren worden opgehaald.</div>`;return}
  if(S.status==="nodb"){m.innerHTML=`<div class="empty"><h3>Opslag niet beschikbaar</h3>De verbinding met de database lukt niet. Controleer je internet en open de app opnieuw.</div>`;return}
  let h=S.canWrite?"":`<div class="banner"><b>Alleen meekijken.</b> Je kunt hier alleen meekijken.</div>`;
  if(!j){m.innerHTML=h+`<div class="empty"><h3>Nog geen klus</h3>Maak je eerste klus aan met de crew erbij.</div>${S.canWrite?`<button class="add" data-act="newjob">+ Nieuwe klus</button>`:""}`;return}
  h+=({cs:vCallsheets,mijn:vMijn,team:vTeam,planning:vPlanning,exp:vExp,recce:vRecce}[S.tab]||vCallsheets)();
  m.innerHTML=h;hydratePhotos();
}
const sortedDays=(dir=-1)=>[...S.days].sort((a,b)=>dir*((a.n||0)-(b.n||0)));

function dayBlocks(days){
  const people=allPeople();const TA={};people.forEach(p=>TA[p]=turnaround(p));let h="";
  for(const d of days){
    const team=teamOf(d);
    h+=`<section class="block"><div class="bhead"><span class="dd">DD${esc(d.n)}</span><span class="bmeta">${d.date?`<b>${esc(fmtDate(d.date))}</b>`:""}${d.date&&d.location?" · ":""}${esc(d.location||"")}</span>${S.canWrite?`<button class="iconbtn" data-act="addperson" data-day="${d.id}" aria-label="Crewlid toevoegen">+</button>`:""}</div>`;

function fieldHTML(f,v){

async function pdfInput(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text="";const n=Math.min(pdf.numPages,12);
  for(let i=1;i<=n;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=`\n--- pagina ${i} ---\n`+tc.items.map(t=>t.str+(t.hasEOL?"\n":" ")).join("")}
  const images=[];
  if(text.replace(/\s/g,"").length<300){for(let i=1;i<=Math.min(n,3);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;images.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)))}}
  return{text,images};
}

async function csRun(btn){
  const st=$("csstatus"),file=$("csfile").files[0],pasted=$("cstext").value.trim();
  if(!file&&!pasted){st.textContent="Kies een bestand of plak de tekst.";return}
  if(!S.sample)S.sample=await claude.use("sample").catch(()=>null);
  if(!S.sample){st.textContent="Automatisch lezen werkt hier niet. Stuur de callsheet naar Claude in de chat, dan wordt hij voor je toegevoegd.";return}
  btn.disabled=true;
  try{
    let text=pasted,images=[],source=file?file.name:"geplakte tekst";
    if(file){st.textContent="Bestand lezen…";
      if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){if(!window.pdfjsLib)throw{code:"pdf"};const r=await pdfInput(file);text=(r.text+"\n"+pasted).trim();images=r.images}
      else if(file.type.startsWith("image/"))images=[file];
      else text=(await file.text())+"\n"+pasted;
    }
    if(images.length){const lim=await S.sample.limits().catch(()=>null);if(!lim?.images){if(!text.replace(/\s/g,"")){st.textContent="Deze callsheet is een scan of foto en die kan hier niet gelezen worden. Plak de tekst of stuur hem naar Claude in de chat.";btn.disabled=false;return}images=[]}}
    st.textContent="Callsheet uitlezen… dit duurt even";
    const data=await S.sample.json(csPrompt(text,images.length>0),{modelTier:"default",cache:false,...(images.length?{images}:{})});
    await saveCallsheet(data,source);
  }catch(e){st.textContent=e?.code==="not_granted"?"Je hebt geen toestemming gegeven om Claude de callsheet te laten lezen.":e?.code==="rate_limited"?"Even te veel verzoeken. Probeer het over een minuut opnieuw.":e?.code==="pdf"?"De PDF-lezer is niet geladen. Plak de tekst uit de mail.":"Uitlezen lukte niet. Probeer het opnieuw of plak de tekst.";btn.disabled=false}
}
async function saveCallsheet(d,source){
  const clean={date:/^\d{4}-\d{2}-\d{2}$/.test(d?.date||"")?d.date:"",dd:Number.isFinite(+d?.dd)&&d?.dd!==null&&d?.dd!==""?+d.dd:null,source,importedAt:Date.now()};
  ["title","setName","setAddress","crewParking","crewParkingNote","techParking","crewCall","lightCall","shootStart","wrap","sunrise","sunset","weather","unitBase","lightNotes","catering","notes"].forEach(k=>clean[k]=String(d?.[k]??"").trim());
  Object.entries(LISTS).forEach(([k,keys])=>clean[k]=(Array.isArray(d?.[k])?d[k]:[]).slice(0,60).map(o=>{const r={};keys.forEach(x=>r[x]=String(o?.[x]??"").trim());return r}));
  const id=clean.date||("cs"+Date.now());
  const prev=sheetById(id);if(prev)["setName","setAddress","crewParking","crewParkingNote","techParking","catering","wrap","crewCall"].forEach(k=>{if(!clean[k]&&prev[k])clean[k]=prev[k]});
  const ok=await write(()=>S.db.doc(`jobs/${S.jobId}/callsheets/${id}`).set(clean),"Callsheet toegevoegd");
  if(!ok)return;
  const call=callOf(clean),loc=clean.locations[0]?.name||"";
  const plan={date:clean.date,location:loc,start:call,end:call?addMin(call,dayMin()):"",transport:"",equipment:clean.lightNotes};
  Object.keys(plan).forEach(k=>{if(!plan[k])delete plan[k]});
  let day=clean.date?S.days.find(x=>x.date===clean.date):null;

  if(!window.supabase||SUPA_URL.startsWith("__")){S.status="nodb";render();return false}
  SB=supabase.createClient(SUPA_URL,SUPA_KEY,{global:{headers:{"x-crew-code":code}},auth:{persistSession:false,autoRefreshToken:false}});
