<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0a0a0b">

<link rel="icon" type="image/png" href="IMG_2519.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sleepers Crew</title>
<style>
  html,body{margin:0;background:#0a0a0b;color:#a3a3aa;font:16px/1.5 system-ui,-apple-system,sans-serif;height:100%}
  #boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  #boot img{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 14px}
  #boot button{margin-top:14px;background:#ff7a1a;color:#150900;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="boot"><div><img src="IMG_2519.png" alt=""><span id="msg">Laden…</span></div></div>
<script>
(function () {
  var URL = "https://sglgbpmdrehejezokqkz.supabase.co/rest/v1/app_files?name=eq.app&select=content";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnbGdicG1kcmVoZWplem9rcWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTg0OTcsImV4cCI6MjEwODE3NDQ5N30.gbn27q5BSec_guO6POJ_30f726G2wRNuFtCVkkl6x7o";
  var CACHE = "slp.appcache";
  function show(html) { document.open(); document.write(html); document.close(); }
  function fail() {
    var cached = null; try { cached = localStorage.getItem(CACHE); } catch (e) {}
    if (cached) { show(cached); return; }
    document.getElementById("msg").innerHTML = "Geen verbinding.<br><button onclick=\"location.reload()\">Opnieuw proberen</button>";
  }
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
  fetch(URL, { headers: { apikey: KEY, Authorization: "Bearer " + KEY }, cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (rows) {
      clearTimeout(timer);
      var html = rows && rows[0] && rows[0].content;
      if (!html) { fail(); return; }
      try { localStorage.setItem(CACHE, html); } catch (e) {}
      show(html);
    })
    .catch(function () { clearTimeout(timer); fail(); });
})();
</script>
</body>
</html>
